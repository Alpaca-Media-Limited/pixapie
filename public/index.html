  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 14 14' shape-rendering='crispEdges'%3E%3Crect x='5' y='3' width='4' height='1' fill='%23030405'/%3E%3Crect x='3' y='4' width='2' height='1' fill='%23030405'/%3E%3Crect x='5' y='4' width='1' height='1' fill='%23ffbe85'/%3E%3Crect x='6' y='4' width='1' height='1' fill='%23ffbe85'/%3E%3Crect x='7' y='4' width='2' height='1' fill='%23ff8a2b'/%3E%3Crect x='9' y='4' width='2' height='1' fill='%23030405'/%3E%3Crect x='2' y='5' width='1' height='1' fill='%23030405'/%3E%3Crect x='3' y='5' width='1' height='1' fill='%23ffbe85'/%3E%3Crect x='4' y='5' width='1' height='1' fill='%23ff8a2b'/%3E%3Crect x='5' y='5' width='1' height='1' fill='%2322c3b0'/%3E%3Crect x='6' y='5' width='2' height='1' fill='%23ff8a2b'/%3E%3Crect x='8' y='5' width='1' height='1' fill='%2322c3b0'/%3E%3Crect x='9' y='5' width='2' height='1' fill='%23ff8a2b'/%3E%3Crect x='11' y='5' width='1' height='1' fill='%23030405'/%3E%3Crect x='1' y='6' width='1' height='1' fill='%23030405'/%3E%3Crect x='2' y='6' width='1' height='1' fill='%23ffbe85'/%3E%3Crect x='3' y='6' width='3' height='1' fill='%23ff8a2b'/%3E%3Crect x='6' y='6' width='1' height='1' fill='%2322c3b0'/%3E%3Crect x='7' y='6' width='2' height='1' fill='%23ff8a2b'/%3E%3Crect x='9' y='6' width='1' height='1' fill='%2322c3b0'/%3E%3Crect x='10' y='6' width='2' height='1' fill='%23ff8a2b'/%3E%3Crect x='12' y='6' width='1' height='1' fill='%23030405'/%3E%3Crect x='0' y='7' width='1' height='1' fill='%23030405'/%3E%3Crect x='1' y='7' width='2' height='1' fill='%23ff8a2b'/%3E%3Crect x='3' y='7' width='1' height='1' fill='%2322c3b0'/%3E%3Crect x='4' y='7' width='4' height='1' fill='%23ff8a2b'/%3E%3Crect x='8' y='7' width='1' height='1' fill='%2322c3b0'/%3E%3Crect x='9' y='7' width='4' height='1' fill='%23ff8a2b'/%3E%3Crect x='13' y='7' width='1' height='1' fill='%23030405'/%3E%3Crect x='0' y='8' width='1' height='1' fill='%23030405'/%3E%3Crect x='1' y='8' width='1' height='1' fill='%23b85a14'/%3E%3Crect x='2' y='8' width='10' height='1' fill='%23ff8a2b'/%3E%3Crect x='12' y='8' width='1' height='1' fill='%23b85a14'/%3E%3Crect x='13' y='8' width='1' height='1' fill='%23030405'/%3E%3Crect x='0' y='9' width='1' height='1' fill='%23030405'/%3E%3Crect x='1' y='9' width='1' height='1' fill='%234b5f60'/%3E%3Crect x='2' y='9' width='10' height='1' fill='%238fa6a3'/%3E%3Crect x='12' y='9' width='1' height='1' fill='%234b5f60'/%3E%3Crect x='13' y='9' width='1' height='1' fill='%23030405'/%3E%3Crect x='1' y='10' width='1' height='1' fill='%23030405'/%3E%3Crect x='2' y='10' width='10' height='1' fill='%234b5f60'/%3E%3Crect x='12' y='10' width='1' height='1' fill='%23030405'/%3E%3Crect x='2' y='11' width='10' height='1' fill='%23030405'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar panel">
      <div class="brand">Pix<span>api</span>e<svg class="pie" viewBox="0 0 14 12" width="42" height="36" shape-rendering="crispEdges" aria-hidden="true"><rect class="st" x="4" y="0" width="1" height="1"/><rect class="st" x="8" y="0" width="1" height="1"/><rect class="st" x="5" y="1" width="1" height="1"/><rect class="st" x="9" y="1" width="1" height="1"/><rect class="st" x="4" y="2" width="1" height="1"/><rect class="st" x="8" y="2" width="1" height="1"/><rect class="k" x="5" y="3" width="4" height="1"/><rect class="k" x="3" y="4" width="2" height="1"/><rect class="p" x="5" y="4" width="1" height="1"/><rect class="p" x="6" y="4" width="1" height="1"/><rect class="o" x="7" y="4" width="2" height="1"/><rect class="k" x="9" y="4" width="2" height="1"/><rect class="k" x="2" y="5" width="1" height="1"/><rect class="p" x="3" y="5" width="1" height="1"/><rect class="o" x="4" y="5" width="1" height="1"/><rect class="t" x="5" y="5" width="1" height="1"/><rect class="o" x="6" y="5" width="2" height="1"/><rect class="t" x="8" y="5" width="1" height="1"/><rect class="o" x="9" y="5" width="2" height="1"/><rect class="k" x="11" y="5" width="1" height="1"/><rect class="k" x="1" y="6" width="1" height="1"/><rect class="p" x="2" y="6" width="1" height="1"/><rect class="o" x="3" y="6" width="3" height="1"/><rect class="t" x="6" y="6" width="1" height="1"/><rect class="o" x="7" y="6" width="2" height="1"/><rect class="t" x="9" y="6" width="1" height="1"/><rect class="o" x="10" y="6" width="2" height="1"/><rect class="k" x="12" y="6" width="1" height="1"/><rect class="k" x="0" y="7" width="1" height="1"/><rect class="o" x="1" y="7" width="2" height="1"/><rect class="t" x="3" y="7" width="1" height="1"/><rect class="o" x="4" y="7" width="4" height="1"/><rect class="t" x="8" y="7" width="1" height="1"/><rect class="o" x="9" y="7" width="4" height="1"/><rect class="k" x="13" y="7" width="1" height="1"/><rect class="k" x="0" y="8" width="1" height="1"/><rect class="d" x="1" y="8" width="1" height="1"/><rect class="o" x="2" y="8" width="10" height="1"/><rect class="d" x="12" y="8" width="1" height="1"/><rect class="k" x="13" y="8" width="1" height="1"/><rect class="k" x="0" y="9" width="1" height="1"/><rect class="m" x="1" y="9" width="1" height="1"/><rect class="s2" x="2" y="9" width="10" height="1"/><rect class="m" x="12" y="9" width="1" height="1"/><rect class="k" x="13" y="9" width="1" height="1"/><rect class="k" x="1" y="10" width="1" height="1"/><rect class="m" x="2" y="10" width="10" height="1"/><rect class="k" x="12" y="10" width="1" height="1"/><rect class="k" x="2" y="11" width="10" height="1"/></svg></div>
      <button id="newBtn" class="btn btn-block">+ NEW REQUEST</button>
      <input id="filter" class="input" placeholder="filter saved..." spellcheck="false">
      <div class="label">SAVED</div>
      <ul id="savedList" class="saved-list"></ul>
    </aside>

    <main class="main">
      <section class="panel request">
        <input id="reqName" class="name-input" placeholder="Name your API" spellcheck="false" aria-label="Request name">

        <div class="url-bar">
          <select id="method" class="input method" aria-label="Method">
            <option>GET</option>
            <option>POST</option>
            <option>PUT</option>
            <option>PATCH</option>
            <option>DELETE</option>
            <option>HEAD</option>
            <option>OPTIONS</option>
          </select>
          <input id="url" class="input url" placeholder="https://jsonplaceholder.typicode.com/todos/1" spellcheck="false" aria-label="URL">
          <button id="sendBtn" class="btn btn-go" title="Ctrl+Enter">SEND</button>
          <button id="saveBtn" class="btn" title="Ctrl+S">SAVE</button>
          <button id="saveNewBtn" class="btn btn-ghost" title="Save as a new request (Ctrl+Shift+S)" hidden>SAVE NEW</button>
        </div>

        <div class="tabs">
          <button class="tab active" data-tab="headers">HEADERS <span id="headerCount" class="count"></span></button>
          <button class="tab" data-tab="body">BODY</button>
        </div>

        <div class="tab-pane active" data-pane="headers">
          <div id="headerRows" class="kv"></div>
          <button id="addHeader" class="btn btn-sm">+ ADD HEADER</button>
        </div>

        <div class="tab-pane" data-pane="body">
          <div class="body-bar">
            <select id="bodyType" class="input input-sm" aria-label="Body type">
              <option value="none">NONE</option>
              <option value="json">JSON</option>
              <option value="text">TEXT</option>
              <option value="xml">XML</option>
              <option value="form">FORM URL-ENCODED</option>
            </select>
            <span id="ctHint" class="hint"></span>
            <button id="formatBtn" class="btn btn-sm">FORMAT JSON</button>
          </div>
          <textarea id="bodyText" class="input code" spellcheck="false"></textarea>
          <div id="formWrap">
            <div id="formRows" class="kv"></div>
            <button id="addField" class="btn btn-sm">+ ADD FIELD</button>
          </div>
          <div id="noBody" class="empty-sm">This request has no body.</div>
        </div>
      </section>

      <section class="panel response">
        <div class="resp-head">
          <div class="label">RESPONSE</div>
          <div class="stats">
            <span id="status" class="badge" hidden></span>
            <span id="time" class="stat"></span>
            <span id="size" class="stat"></span>
          </div>
        </div>

        <div class="tabs">
          <button class="tab active" data-tab="pretty">PRETTY</button>
          <button class="tab" data-tab="raw">RAW</button>
          <button class="tab" data-tab="resHeaders">HEADERS <span id="resHeaderCount" class="count"></span></button>
          <div class="tab-tools">
            <button id="expandAll" class="btn btn-sm">+ ALL</button>
            <button id="collapseAll" class="btn btn-sm">- ALL</button>
            <button id="copyBtn" class="btn btn-sm">COPY</button>
          </div>
        </div>

        <div class="resp-body">
          <div class="tab-pane active" data-pane="pretty">
            <div id="pretty" class="json"><div class="empty">PRESS SEND TO FIRE A REQUEST<span class="blink">_</span></div></div>
          </div>
          <div class="tab-pane" data-pane="raw"><pre id="raw" class="code-block"></pre></div>
          <div class="tab-pane" data-pane="resHeaders"><table id="resHeaders" class="htable"></table></div>
        </div>
      </section>
    </main>
  </div>

  <datalist id="headerKeys">
    <option value="Accept"></option>
    <option value="Authorization"></option>
    <option value="Cache-Control"></option>
    <option value="Content-Type"></option>
    <option value="Cookie"></option>
    <option value="User-Agent"></option>
    <option value="X-API-Key"></option>
  </datalist>
  <datalist id="contentTypes">
    <option value="application/json"></option>
    <option value="application/xml"></option>
    <option value="application/x-www-form-urlencoded"></option>
    <option value="multipart/form-data"></option>
    <option value="text/plain"></option>
    <option value="text/html"></option>
    <option value="Bearer "></option>
  </datalist>

  <div id="toast" class="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
